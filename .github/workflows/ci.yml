name: CI

# v3 全原生自研：只校验 .NET 解决方案，无 Python / Node 环节
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: .NET 8 solution (all projects, warnings as errors)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show SDKs
        run: dotnet --list-sdks
        shell: pwsh

      # 隐式还原，避免漏 restore 某个工程导致 NETSDK1004
      - name: Build solution
        run: dotnet build src/AiClassAssistant.sln -c Release -warnaserror
        shell: pwsh
