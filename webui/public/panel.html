<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 课堂助手 · 桌面面板</title>
<style>
  :root{
    --primary:#0F766E; --accent:#14B8A6; --soft:#E3F6F3; --bg:#F1F5F9;
    --card:#FFFFFF; --header-bg:#0A4E48; --text:#0F172A; --text-2:#334155;
    --border:#E2E8F0; --muted:#64748B; --green:#16A34A;
    --radius:14px; --shadow:0 2px 10px rgba(15,23,42,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
  button{font-family:inherit;cursor:pointer}

  /* 顶栏 */
  .topbar{background:var(--header-bg);height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#fff}
  .logo{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--header-bg);border-radius:999px;padding:7px 12px 7px 16px;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .logo svg{width:22px;height:22px;color:var(--primary)}
  .status{display:inline-flex;align-items:center;gap:8px;color:#A7F3D0;font-size:13px}
  .status i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
  .status.off{color:#FCD34D}.status.off i{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.15)}

  /* 布局 */
  .wrap{max-width:1320px;margin:0 auto;padding:18px 18px 12px}
  .grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(360px,1.7fr) minmax(250px,1fr);gap:14px;align-items:stretch}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px}
  .muted{color:var(--muted)}

  /* 左：当前课程 */
  .course{display:flex;flex-direction:column;align-items:center;text-align:center}
  .pill{align-self:flex-start;background:var(--soft);color:var(--primary);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
  .subject{font-size:44px;font-weight:800;letter-spacing:2px;margin:26px 0 4px;color:var(--text)}
  .course-meta{color:var(--text-2);font-size:13px}
  .countdown{margin-top:20px;color:var(--text-2);font-size:14px}
  .ring{margin:14px 0 6px;width:170px;height:170px}
  .ring-center{font-size:13px;color:var(--muted);margin-top:-6px}

  /* 中：课堂记录 */
  .model-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F6F8FA;border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:14px}
  .model-row .label{color:var(--muted);font-size:13px}
  .model-row .value{font-weight:700;color:var(--text);font-size:14px;flex:1;margin-left:6px}
  .model-row .chev{color:var(--muted);font-size:18px}
  .wave{position:relative;height:210px;border:1px solid var(--border);border-radius:10px;background:#fff;overflow:hidden;padding:8px 10px}
  .grid-line{position:absolute;left:0;right:0;border-top:1px dashed #EEF2F6}
  .y-label{position:absolute;left:8px;font-size:10px;color:#94A3B8}
  .bars{position:absolute;left:40px;right:12px;top:10px;bottom:22px;display:flex;align-items:center;gap:2px}
  .bar{flex:1;background:linear-gradient(180deg,#5EEAD4,#0D9488);border-radius:3px;min-height:2px;opacity:.9}
  .x-label{position:absolute;bottom:4px;left:40px;right:12px;display:flex;justify-content:space-between;font-size:10px;color:#94A3B8}
  .rec-actions{display:flex;gap:12px;margin-top:16px}
  .btn{flex:1;border-radius:999px;padding:11px 0;font-weight:700;font-size:14px;border:1px solid transparent;transition:transform .15s,background .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(15,118,110,.25)}
  .btn-outline{border-color:var(--primary);color:var(--primary);background:#fff}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

  /* 右列 */
  .side{display:flex;flex-direction:column;gap:14px}
  .side .card{padding:16px}
  .schedule-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--text-2)}
  .schedule-row.active{background:var(--soft);color:var(--primary);font-weight:700}
  .schedule-row .t{color:var(--muted)}
  .schedule-row.active .t{color:var(--primary)}
  .check{display:flex;align-items:center;gap:9px;color:var(--text-2);font-size:13px;margin-top:4px}
  .check svg{width:20px;height:20px;color:var(--green)}
  .quick-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px}
  .switch{position:relative;width:42px;height:23px;border-radius:999px;border:none;background:#CBD5E1;transition:background .2s}
  .switch.on{background:var(--accent)}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
  .switch.on::after{transform:translateX(19px)}
  .tunnel{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--text-2);font-size:12px}

  /* 底部状态条 */
  .statusbar{margin-top:14px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:13px 20px;font-size:13px;color:var(--text-2);flex-wrap:wrap;gap:8px}
  .statusbar .seg{display:flex;align-items:center;gap:14px}
  .statusbar .dot{width:7px;height:7px}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:9;display:none}

  @media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}.side{grid-column:1/-1;flex-direction:row}.side .card{flex:1}}
  @media(max-width:680px){.grid{grid-template-columns:1fr}.side{flex-direction:column}.subject{font-size:36px}.topbar{height:58px;padding:0 14px}.logo{font-size:13px}.status{font-size:12px}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="logo">
      AI 课堂助手
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 16h6"/>
      </svg>
    </div>
    <div class="status" id="topStatus"><i></i><span>运行中</span></div>
  </header>

  <div class="wrap">
    <div class="grid">
      <!-- 左：当前课程 -->
      <section class="card course">
        <span class="pill">当前课程</span>
        <div class="subject" id="subject">—</div>
        <div class="course-meta" id="courseMeta">暂无进行中的课程</div>
        <div class="countdown" id="countdown">距下课 — 分钟</div>
        <svg class="ring" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#14B8A6"/><stop offset="100%" stop-color="#5EEAD4"/>
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="50" fill="none" stroke="#EDF2F7" stroke-width="10"/>
          <circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="url(#ringGrad)" stroke-width="10"
                  stroke-linecap="round" stroke-dasharray="0 314" transform="rotate(-90 60 60)"/>
          <circle cx="60" cy="60" r="38" fill="none" stroke="#E3F6F3" stroke-width="4" stroke-dasharray="40 200" transform="rotate(30 60 60)"/>
        </svg>
        <div class="ring-center" id="ringCenter">课程进度</div>
      </section>

      <!-- 中：课堂记录 -->
      <section class="card">
        <div class="title">课堂记录中</div>
        <div class="model-row">
          <span class="label">模型：</span>
          <span class="value" id="modelName">未选择</span>
          <span class="chev">›</span>
        </div>
        <div class="wave">
          <div class="grid-line" style="top:20%"></div>
          <div class="grid-line" style="top:45%"></div>
          <div class="grid-line" style="top:70%"></div>
          <span class="y-label" style="top:18%">80</span>
          <span class="y-label" style="top:43%">40</span>
          <span class="y-label" style="top:68%">00</span>
          <span class="y-label" style="top:88%">0</span>
          <div class="bars" id="bars"></div>
          <div class="x-label"><span>15</span><span>20</span><span>20</span><span>140</span><span>16</span></div>
        </div>
        <div class="rec-actions">
          <button class="btn btn-primary" id="btnSummary">生成总结</button>
          <button class="btn btn-outline" id="btnExport">导出课堂</button>
        </div>
      </section>

      <!-- 右列 -->
      <div class="side">
        <section class="card">
          <div class="title">今日课表</div>
          <div id="schedule"></div>
        </section>
        <section class="card">
          <div class="title">拖堂监测</div>
          <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
            <span id="overtimeText">监测中 · 未拖堂</span>
          </div>
        </section>
        <section class="card">
          <div class="title">快捷操作</div>
          <div class="quick-row"><span>开启监控</span><button class="switch on" id="monitorSwitch" aria-label="监控开关"></button></div>
          <div class="tunnel"><span class="dot"></span><span id="tunnelText">隧道已连接</span></div>
        </section>
      </div>
    </div>

    <div class="statusbar">
      <div class="seg"><span class="dot"></span><span>监控</span><span class="dot"></span><span id="barMonitor">开启</span></div>
      <div class="seg">存储：导出 <span id="barDate">—</span></div>
      <div class="seg"><span class="dot"></span><span>隧道</span><span class="dot"></span><span id="barTunnel">已连接</span></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // 面板可由 Python 同源托管，也可直接以 file:// 打开；后者回退到本机 18760
  const API = location.protocol === 'file:' ? 'http://127.0.0.1:18760' : ''
  const $ = (id) => document.getElementById(id)

  async function j(path, opts) {
    const r = await fetch(API + path, opts)
    const ct = r.headers.get('content-type') || ''
    const d = ct.includes('json') ? await r.json() : await r.text()
    if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status))
    return d
  }
  function toast(t) {
    const el = $('toast'); el.textContent = t; el.style.display = 'block'
    clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.display = 'none' }, 2400)
  }
  function mins(t) {
    const m = /^(\d{1,2}):(\d{2})/.exec(t || '')
    return m ? (+m[1]) * 60 + (+m[2]) : -1
  }
  function todayStr() {
    const d = new Date()
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
  }

  const data = { state: {}, db: {}, schedule: {}, online: false }

  function render() {
    const st = data.state || {}
    const items = (data.schedule && data.schedule.items) || []
    const now = new Date()
    const cur = now.getHours() * 60 + now.getMinutes()

    // 当前课程：优先会话 subject，否则按课表时间匹配
    let active = null
    const sub = st.session && st.session.subject
    if (sub) active = items.find((i) => i.subject === sub) || { subject: sub, start: st.session.start, end: st.session.end }
    if (!active) active = items.find((i) => {
      const s = mins(i.start), e = mins(i.end)
      return s >= 0 && e >= s && cur >= s && cur < e
    }) || null

    $('subject').textContent = active ? active.subject : '—'
    $('courseMeta').textContent = active
      ? ((st.class_name || (st.session && st.session.class_name) || '班级') + ' · ' + (active.start || '') + '-' + (active.end || ''))
      : '暂无进行中的课程'

    let left = 0, pct = 0
    if (active) {
      const s = mins(active.start), e = mins(active.end)
      left = e >= 0 ? Math.max(0, e - cur) : 0
      pct = e > s ? Math.min(1, Math.max(0, (cur - s) / (e - s))) : 0
    }
    $('countdown').textContent = active ? ('距下课 ' + left + ' 分钟') : '距下课 — 分钟'
    const C = 2 * Math.PI * 50
    $('ringArc').setAttribute('stroke-dasharray', (C * pct).toFixed(1) + ' ' + C.toFixed(1))
    $('ringCenter').textContent = active ? (Math.round(pct * 100) + '% 已完成') : '课程进度'

    // 模型
    $('modelName').textContent = st.model || '未选择'

    // 分贝柱状波形
    const samples = (data.db && Array.isArray(data.db.samples) && data.db.samples) || []
    const bars = $('bars')
    bars.innerHTML = ''
    const peak = Math.max(80, ...samples)
    const source = samples.length ? samples : Array.from({ length: 52 }, (_, i) => 30 + 18 * Math.sin(i / 3) + 8 * Math.cos(i / 1.7))
    const shown = source.slice(-70)
    for (const v of shown) {
      const b = document.createElement('div')
      b.className = 'bar'
      const h = Math.max(2, (Math.max(0, v) / peak) * 78)
      b.style.height = h + 'px'
      b.style.opacity = samples.length ? '.92' : '.35'
      bars.appendChild(b)
    }

    // 课表
    const sc = $('schedule')
    sc.innerHTML = ''
    items.forEach((i) => {
      const row = document.createElement('div')
      row.className = 'schedule-row' + (active && i.subject === active.subject ? ' active' : '')
      row.innerHTML = '<span>' + esc(i.subject) + '</span><span class="t">' + esc(i.start) + '</span>'
      sc.appendChild(row)
    })
    if (!items.length) sc.innerHTML = '<div class="muted" style="font-size:12px;padding:8px 0">暂无课程安排</div>'

    // 拖堂 / 监控 / 隧道
    const ot = st.session && st.session.overtime
    $('overtimeText').textContent = ot ? '检测到拖堂 · 请留意' : '监测中 · 未拖堂'
    const on = !!st.monitor_enabled
    $('monitorSwitch').classList.toggle('on', on)
    $('barMonitor').textContent = on ? '开启' : '关闭'
    const tunnelOn = !!(st.tunnel && (st.tunnel.enabled || st.tunnel.url))
    $('tunnelText').textContent = tunnelOn ? '隧道已连接' : '隧道未连接'
    $('barTunnel').textContent = tunnelOn ? '已连接' : '未连接'
    $('barDate').textContent = (data.schedule && data.schedule.date) || todayStr()

    const ts = $('topStatus')
    ts.classList.toggle('off', !data.online)
    ts.querySelector('span').textContent = data.online ? '运行中' : '未连接（占位）'
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  }

  async function load() {
    const [s, d, sc] = await Promise.allSettled([j('/api/state'), j('/api/db'), j('/api/schedule')])
    data.online = s.status === 'fulfilled'
    data.state = s.status === 'fulfilled' ? s.value : {}
    data.db = d.status === 'fulfilled' ? d.value : {}
    data.schedule = sc.status === 'fulfilled' ? sc.value : {}
    render()
  }

  $('monitorSwitch').addEventListener('click', async () => {
    const next = !$('monitorSwitch').classList.contains('on')
    const r = await j('/api/monitor', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: next })
    }).catch(() => null)
    if (r) { data.state = { ...data.state, ...r }; render(); toast(next ? '监控已开启' : '监控已关闭') }
    else toast('操作失败：核心服务不可用')
  })

  $('btnSummary').addEventListener('click', async () => {
    const r = await j('/api/summarize', { method: 'POST' }).catch(() => null)
    toast(r ? '已触发生成总结' : '操作失败：核心服务不可用')
  })
  $('btnExport').addEventListener('click', async () => {
    const r = await j('/api/export', { method: 'POST' }).catch(() => null)
    toast(r ? '已触发导出' : '操作失败：核心服务不可用')
  })

  render()
  load()
  setInterval(load, 30000)
</script>
</body>
</html>
